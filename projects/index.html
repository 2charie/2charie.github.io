<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="심리학, 웹 기획, 데이터 분석과 AI·스마트팜의 학습 및 프로젝트를 기록하는 개인 포트폴리오.">
<title>Projects — 2charie</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../assets/css/variables.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/layout.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
<a class="skip-link" href="#main">본문으로 건너뛰기</a>
<header class="site-header" data-header>
</header>
<main id="main" class="container page-main">
<div class="page-heading">
<p class="eyebrow">THE PROJECT ARCHIVE</p>
<h1>All Projects.</h1>
<p>다양한 분야를 연결하며 쌓아가는 경험과 학습의 기록입니다.</p>
</div>
<section aria-label="프로젝트 분류">
<div class="filter-heading">
<span class="eyebrow">EXPLORE BY CATEGORY</span>
<button type="button" class="motion-toggle" data-motion-toggle aria-pressed="false">자동 이동 일시정지 <span aria-hidden="true">Ⅱ</span>
</button>
</div>
<div class="filter-marquee" data-marquee tabindex="0" role="region" aria-label="프로젝트 분류. 좌우로 스크롤할 수 있습니다.">
<div class="filter-track" data-filter-track>
</div>
</div>
</section>
<div class="results-heading">
<p data-results role="status" aria-live="polite">
</p>
<span class="eyebrow">PROJECT INDEX</span>
</div>
<div class="project-grid" data-project-grid>
</div>
<div class="empty-state" data-empty hidden>
<h2>아직 등록된 프로젝트가 없습니다.</h2>
<p>다른 분류를 선택하거나 전체 프로젝트를 확인해 주세요.</p>
<button type="button" class="button button-secondary" data-reset>전체 프로젝트 보기 ↗</button>
</div>
</main>
<footer class="site-footer" data-footer>
</footer>
<script src="../assets/js/projects-data.js" defer>
</script>
<script src="../assets/js/main.js" defer>
</script>
<script src="../assets/js/projects.js" defer>
</script>
</body>
</html>
